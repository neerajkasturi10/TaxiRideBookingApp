[project]
name = "ridingapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "azure-eventhub>=5.15.1",
    "faker>=40.19.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.62.0",
]

[project.scripts]
ridingapp = "ridingapp:main"
ridingapp-generate-historical = "ridingapp.historical:main"
ridingapp-generate-mappers = "ridingapp.mappers:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
